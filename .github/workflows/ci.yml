name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CloudFormation template
        run: |
          test -f cloudformation.yaml
          grep -q "AWS::Lambda::Function" cloudformation.yaml
          grep -q "cursor-agent worker controller --spawn" cloudformation.yaml
          test -f handler.mjs
          test -f spawn.mjs
          test ! -d src
          test ! -d test
          test ! -f package.json
