AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  IAM and artifact bucket for Cursor pool workers on AWS Lambda MicroVMs.
  `agent worker controller --spawn ./spawn.sh` execs spawn.sh; this stack
  does not poll, schedule, or keep slot state.

Parameters:
  ProjectName:
    Type: String
    Default: cursor-lambda-workers
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,40}[a-z0-9]$"
    Description: Lower-case name prefix for created resources.

  ImageNamePrefix:
    Type: String
    Default: cursor-pool-worker
    AllowedPattern: "^[a-zA-Z0-9][a-zA-Z0-9-_]{0,62}$"
    Description: MicroVM image name prefix; build logs go to /aws/lambda/microvms/<image-name>.

  CursorApiKeyParamName:
    Type: String
    Default: /cursor-lambda-workers/cursor-api-key
    Description: >-
      Optional SSM SecureString the MicroVM can read when spawn does not
      pass CURSOR_API_KEY in the run hook. Create out-of-band.

  GitTokenParamName:
    Type: String
    Default: /cursor-lambda-workers/git-token
    Description: Optional SSM SecureString for a git HTTPS token.

  ExtraIngressConnectorArn:
    Type: String
    Default: ""
    Description: Optional extra Lambda Network Connector ARN (customer VPC ingress).

  ExtraEgressConnectorArn:
    Type: String
    Default: ""
    Description: Optional extra Lambda Network Connector ARN (customer VPC egress).

Conditions:
  HasExtraIngress: !Not [!Equals [!Ref ExtraIngressConnectorArn, ""]]
  HasExtraEgress: !Not [!Equals [!Ref ExtraEgressConnectorArn, ""]]

Resources:
  SpawnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-spawn-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: run-microvm
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "lambda:RunMicroVm"
                Resource: "*"
              - Effect: Allow
                Action: "iam:PassRole"
                Resource: !GetAtt MicroVmExecutionRole.Arn
              - Effect: Allow
                Action: "lambda:PassNetworkConnector"
                Resource:
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:aws:network-connector:aws-network-connector:ALL_INGRESS"
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:aws:network-connector:aws-network-connector:INTERNET_EGRESS"
                  - !If
                    - HasExtraIngress
                    - !Ref ExtraIngressConnectorArn
                    - !Ref AWS::NoValue
                  - !If
                    - HasExtraEgress
                    - !Ref ExtraEgressConnectorArn
                    - !Ref AWS::NoValue

  MicroVmExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-microvm-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - "sts:AssumeRole"
              - "sts:TagSession"
      Policies:
        - PolicyName: read-cursor-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "ssm:GetParameter"
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${CursorApiKeyParamName}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GitTokenParamName}"
              - Effect: Allow
                Action: "kms:Decrypt"
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
                  StringLike:
                    kms:EncryptionContext:PARAMETER_ARN:
                      - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${CursorApiKeyParamName}"
                      - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GitTokenParamName}"
        - PolicyName: optional-repo-cache
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "s3:GetObject"
                Resource: !Sub "${ArtifactBucket.Arn}/repo-cache/*"
        - PolicyName: self-lifecycle
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "lambda:SuspendMicrovm"
                  - "lambda:TerminateMicrovm"
                Resource: "*"
        - PolicyName: runtime-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/microvms/${ImageNamePrefix}*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/microvms/${ImageNamePrefix}*:*"

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-artifacts-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-build-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - "sts:AssumeRole"
              - "sts:TagSession"
      Policies:
        - PolicyName: artifact-bucket-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:PutObject"
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
        - PolicyName: build-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/microvms/${ImageNamePrefix}*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/microvms/${ImageNamePrefix}*:*"

Outputs:
  SpawnRoleArn:
    Description: IAM role spawn.sh assumes to call RunMicrovm.
    Value: !GetAtt SpawnRole.Arn
  ArtifactBucketName:
    Description: S3 bucket for the MicroVM image source (app.zip) and optional repo tarballs.
    Value: !Ref ArtifactBucket
  BuildRoleArn:
    Description: Build role ARN passed to create-microvm-image.
    Value: !GetAtt BuildRole.Arn
  MicroVmExecutionRoleArn:
    Description: Execution role each MicroVM assumes (SSM + self-terminate).
    Value: !GetAtt MicroVmExecutionRole.Arn
  CursorApiKeyParamName:
    Description: Optional SSM SecureString for the Cursor service-account API key.
    Value: !Ref CursorApiKeyParamName
  GitTokenParamName:
    Description: Optional SSM SecureString for a git HTTPS token.
    Value: !Ref GitTokenParamName
