AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Cursor pool workers on AWS Lambda MicroVMs. Apply this template, then start
  an agent from cursor.com/agents. The Lambda execs
  `cursor-agent worker controller --spawn ./spawn.mjs`.

Parameters:
  ProjectName:
    Type: String
    Default: cursor-lambda-workers
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,40}[a-z0-9]$"
  ControllerImageUri:
    Type: String
    Description: ECR image built from controller/Dockerfile (./deploy.sh).
  PoolName:
    Type: String
    Default: default
  MicroVmImageIdentifier:
    Type: String
    Default: cursor-pool-worker
  CursorApiKeyParamName:
    Type: String
    Default: /cursor-lambda-workers/cursor-api-key
    Description: SSM SecureString for the Cursor service-account API key.

Conditions:
  ImageIsArn: !Equals [!Select [0, !Split [":", !Ref MicroVmImageIdentifier]], "arn"]

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-artifacts-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  MicroVmExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-microvm-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: ["sts:AssumeRole", "sts:TagSession"]
      Policies:
        - PolicyName: guest
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${CursorApiKeyParamName}"
              - Effect: Allow
                Action: ["logs:CreateLogGroup", "logs:CreateLogStream", "logs:PutLogEvents"]
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/microvms/*"

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-build-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: ["sts:AssumeRole", "sts:TagSession"]
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["s3:GetObject", "s3:PutObject"]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub "${ArtifactBucket.Arn}/*"]
              - Effect: Allow
                Action: ["logs:CreateLogGroup", "logs:CreateLogStream", "logs:PutLogEvents"]
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/microvms/*"

  ControllerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-controller-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: controller
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["logs:CreateLogGroup", "logs:CreateLogStream", "logs:PutLogEvents"]
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-controller*"
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${CursorApiKeyParamName}"
              - Effect: Allow
                Action: lambda:RunMicroVm
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt MicroVmExecutionRole.Arn
              - Effect: Allow
                Action: lambda:PassNetworkConnector
                Resource:
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:aws:network-connector:aws-network-connector:ALL_INGRESS"
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:aws:network-connector:aws-network-connector:INTERNET_EGRESS"

  ControllerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-controller"
      PackageType: Image
      Architectures: [arm64]
      Timeout: 900
      MemorySize: 1024
      ReservedConcurrentExecutions: 1
      Role: !GetAtt ControllerRole.Arn
      Code:
        ImageUri: !Ref ControllerImageUri
      Environment:
        Variables:
          CURSOR_POOL: !Ref PoolName
          CURSOR_AGENT_BIN: /root/.local/bin/agent
          CURSOR_API_KEY: !Sub "{{resolve:ssm-secure:${CursorApiKeyParamName}}}"
          CURSOR_API_KEY_PARAM_NAME: !Ref CursorApiKeyParamName
          MICROVM_IMAGE_IDENTIFIER: !If
            - ImageIsArn
            - !Ref MicroVmImageIdentifier
            - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${MicroVmImageIdentifier}"
          MICROVM_EXECUTION_ROLE_ARN: !GetAtt MicroVmExecutionRole.Arn

  PollRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-poll"
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Id: Controller
          Arn: !GetAtt ControllerFunction.Arn

  PollPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ControllerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt PollRule.Arn

Outputs:
  ControllerFunctionName:
    Value: !Ref ControllerFunction
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  BuildRoleArn:
    Value: !GetAtt BuildRole.Arn
  MicroVmExecutionRoleArn:
    Value: !GetAtt MicroVmExecutionRole.Arn
  PoolName:
    Value: !Ref PoolName
